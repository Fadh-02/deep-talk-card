<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Talk Card - Versi Pro</title>
    
    <!-- Memanggil Fail CSS Luaran -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Memanggil Library Ikon Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-container">
        <!-- Navigasi Atas -->
        <nav class="navbar">
            <div class="nav-logo" onclick="changeView('home')">
                <div class="logo-icon">
                    <i data-lucide="message-circle" style="color: white;"></i>
                </div>
                <span style="font-weight: bold; letter-spacing: -0.5px;">DeepTalk</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="nav-btn" onclick="changeView('favorites')">
                    <i data-lucide="star"></i>
                </button>
                <button class="nav-btn" onclick="changeView('history')">
                    <i data-lucide="history"></i>
                </button>
            </div>
        </nav>

        <main class="content">
            <!-- Halaman Utama -->
            <div id="view-home" class="view">
                <div class="mode-selector">
                    <button class="mode-btn active" onclick="setMode('Semua')">Semua</button>
                    <button class="mode-btn" onclick="setMode('Pasangan')">Pasangan</button>
                    <button class="mode-btn" onclick="setMode('Kawan')">Kawan</button>
                    <button class="mode-btn" onclick="setMode('Deep')">Deep</button>
                </div>

                <div class="card-container" onclick="handleCardClick()">
                    <div class="card-inner" id="main-card">
                        <!-- Muka Belakang (Halaman Mula) -->
                        <div class="card-back">
                            <div style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 50%; margin-bottom: 20px;">
                                <i data-lucide="moon" size="32" style="color: white;"></i>
                            </div>
                            <h3 style="font-size: 1.5rem; margin-bottom: 8px;">Deep Talk</h3>
                            <p style="font-size: 0.9rem; opacity: 0.7; font-style: italic;">"Sesuatu yang hebat bermula dari satu soalan yang jujur."</p>
                        </div>

                        <!-- Muka Depan (Soalan) -->
                        <div class="card-front">
                            <div id="card-badge" class="category-badge">
                                <span id="badge-text">DEEP</span>
                            </div>
                            <p id="display-question" class="question-text">Klik untuk cabut kad...</p>
                            <button class="favorite-btn" onclick="toggleFavorite(event)" style="background:none; border:none; cursor:pointer;">
                                <i id="star-icon" data-lucide="star"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button id="next-btn" class="next-btn hidden" onclick="drawCard()">
                    <i id="refresh-icon" data-lucide="refresh-cw"></i>
                    Soalan Seterusnya
                </button>
            </div>

            <!-- Halaman Kegemaran -->
            <div id="view-favorites" class="view hidden" style="width: 100%; max-width: 400px; padding: 20px;">
                <h2 style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="star" style="color: #facc15; fill: #facc15;"></i> Kegemaran
                </h2>
                <div id="favorites-list"></div>
            </div>

            <!-- Halaman Sejarah -->
            <div id="view-history" class="view hidden" style="width: 100%; max-width: 400px; padding: 20px;">
                <h2 style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="history" style="color: #4f46e5;"></i> Sejarah
                </h2>
                <div id="history-list"></div>
            </div>
        </main>

        <footer>
            <p>FADH-02 @ 2024</p>
        </footer>
    </div>

    <!-- Memanggil Fail JS Luaran (Letak di bawah supaya HTML load dulu) -->
    <script src="script.js"></script>
</body>
</html>
